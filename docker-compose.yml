services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cms-backend
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
            - MONGODB_URI=mongodb://mongodb:27017/cms_db
            - MONGODB_DB_NAME=cms_db
        volumes:
            - ./temp:/app/temp
        depends_on:
            mongodb:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - cms-network

    frontend:
        build:
            context: ./client
            dockerfile: Dockerfile
        container_name: cms-frontend
        ports:
            - "80:80"
        depends_on:
            - backend
        restart: unless-stopped
        networks:
            - cms-network

    mongodb:
        image: mongo:7
        container_name: cms-mongodb
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
            - mongodb_config:/data/configdb
        environment:
            - MONGO_INITDB_DATABASE=cms_db
        restart: unless-stopped
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/cms_db --quiet
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 40s
        networks:
            - cms-network

volumes:
    mongodb_data:
        driver: local
    mongodb_config:
        driver: local

networks:
    cms-network:
        driver: bridge
